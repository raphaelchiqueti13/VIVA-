services:
  - type: web
    name: viva-plus
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/viva.sqlite
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: viva-plus-data
      mountPath: /var/data
      sizeGB: 1
