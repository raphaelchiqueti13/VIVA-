<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c51f3a" />
    <meta name="description" content="VIVA+ — Carteira Nacional do Doador. Tecnologia que transforma solidariedade em impacto." />
    <title>VIVA+ | Carteira Nacional do Doador</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Widget oficial VLibras: tradução do conteúdo para Língua Brasileira de Sinais -->
    <div vw class="enabled" aria-label="VLibras: tradução para Libras">
      <div vw-access-button class="active" aria-label="Abrir tradutor VLibras"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js" defer></script>
    <script>
      window.addEventListener('load', function () {
        if (window.VLibras && window.VLibras.Widget) {
          new window.VLibras.Widget('https://vlibras.gov.br/app');
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
